name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-declaration-benchmark:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Install dependencies
        shell: bash
        run: bash .github/actions/setup-workspace/install-dependencies.sh --ignore-scripts
      - name: Compare baseline and fixed declaration generation
        run: node scripts/ci-declaration-benchmark.mjs
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-declaration-benchmark
          path: |
            ci-benchmark-results.json
            .turbo/runs/*.json
          include-hidden-files: true
          retention-days: 7
